<!-- The sitewide top bar (replaces Chirpy's sidebar) -->
<header class="site-header" aria-label="Top Bar">
  <div class="site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">mehrab rahman<span class="dot">·</span></a>

    <button
      type="button"
      class="theme-toggle nav-toggle"
      id="nav-toggle"
      aria-label="Toggle navigation"
      aria-expanded="false"
    >
      <i class="fas fa-bars fa-fw"></i>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      {%- assign url = page.url -%}
      <a href="{{ '/projects/' | relative_url }}"{% if url contains '/projects' %} aria-current="page"{% endif %}>projects</a>
      <a href="{{ '/writing/' | relative_url }}"{% if url contains '/writing' or page.layout == 'post' %} aria-current="page"{% endif %}>writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if url contains '/about' %} aria-current="page"{% endif %}>about</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch color theme" title="Switch theme">
        <i class="fas fa-circle-half-stroke fa-fw" aria-hidden="true"></i>
      </button>
    </nav>
  </div>
</header>

<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
